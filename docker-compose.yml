services:
  postgres:
    image: postgres:16
    container_name: doc_wrapper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_wrapper
      POSTGRES_USER: doc_wrapper
      POSTGRES_PASSWORD: doc_wrapper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_wrapper -d doc_wrapper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
