type CredentialField {
  key: String!
  label: String!
  secret: Boolean!
}

type AiProvider {
  id: ID!
  key: String!
  name: String!
  services: [String!]!
  defaultBaseUrl: String
  authType: String!
  credentialFields: [CredentialField!]!
  credentialHeader: String
  apiKeyUrl: String
  capabilities: JSON
  is_enabled: Boolean!
}

type AiProviderConnection {
  id: ID!
  label: String
  providerId: ID!
  name: String!
  service: String!
  baseUrl: String!
  authType: String!
  modelIds: [String!]!
  status: String!
  hasCredentials: Boolean!
  credentialKeys: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  provider: AiProvider!
  settings: JSON
  is_active: Boolean!
  has_credentials: Boolean!
  created_at: DateTime!
  updated_at: DateTime!
}

type AIProviderConnectionTestResult {
  success: Boolean!
  message: String!
}

input CredentialFieldInput {
  key: String!
  label: String!
  secret: Boolean!
}

input CreateAiProviderInput {
  key: String!
  name: String!
  services: [String!]!
  defaultBaseUrl: String
  authType: String!
  credentialFields: [CredentialFieldInput!]!
  credentialHeader: String
  apiKeyUrl: String
}

input AIProviderCredentialInput {
  key: String!
  value: String!
}

input CreateAIProviderConnectionInput {
  providerId: ID!
  name: String!
  service: String!
  baseUrl: String!
  authType: String!
  credentials: [AIProviderCredentialInput!]!
  modelIds: [String!]!
}

input UpdateAIProviderConnectionInput {
  providerId: ID
  name: String
  service: String
  baseUrl: String
  authType: String
  credentials: [AIProviderCredentialInput!]
  modelIds: [String!]
}

input TestAIProviderConnectionInput {
  providerId: ID!
  name: String!
  service: String!
  baseUrl: String!
  authType: String!
  credentials: [AIProviderCredentialInput!]!
  modelIds: [String!]!
}
