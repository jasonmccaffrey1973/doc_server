"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")
scalar JSON @scalar(class: "App\\GraphQL\\Scalars\\JsonScalar")
scalar Upload @scalar(class: "App\\GraphQL\\Scalars\\Upload")

type Query {
  me: User @field(resolver: "App\\GraphQL\\Queries\\MeQuery")
  navigation(token: String!): [NavigationItem!]! @field(resolver: "App\\GraphQL\\Queries\\NavigationQuery")

  courses(status: String, limit: Int = 25, offset: Int = 0): [Course!]!
    @field(resolver: "App\\GraphQL\\Queries\\CoursesQuery")
  course(id: ID!): Course @field(resolver: "App\\GraphQL\\Queries\\CourseQuery")

  lessons(search: String, limit: Int = 25, offset: Int = 0): [Lesson!]!
    @field(resolver: "App\\GraphQL\\Queries\\LessonsQuery")
  lesson(id: ID!): Lesson @field(resolver: "App\\GraphQL\\Queries\\LessonQuery")

  courseLessons(course_id: ID!): [CourseLesson!]!
    @field(resolver: "App\\GraphQL\\Queries\\CourseLessonsQuery")
  chapterLessons(chapter_id: ID!): [ChapterLesson!]!
    @field(resolver: "App\\GraphQL\\Queries\\ChapterLessonsQuery")

  listMedia(kind: String, limit: Int, offset: Int): MediaConnection!
    @field(resolver: "App\\GraphQL\\Queries\\ListMediaQuery")

  aiGeneratedAssets(type: String, limit: Int = 25, offset: Int = 0): AiGeneratedAssetConnection!
    @field(resolver: "App\\GraphQL\\Queries\\AiGeneratedAssetsQuery")

  aiVideoProjects: [AiVideoProject!]!
    @field(resolver: "App\\GraphQL\\Queries\\AiVideoProjectsQuery")
  aiVideoProject(id: ID!): AiVideoProject
    @field(resolver: "App\\GraphQL\\Queries\\AiVideoProjectQuery")
  aiVideoGenerationJob(id: ID!): AiVideoGenerationJob
    @field(resolver: "App\\GraphQL\\Queries\\AiVideoGenerationJobQuery")
  aiProviders: [AiProvider!]!
    @field(resolver: "App\\GraphQL\\Queries\\AiProvidersQuery")
  myAiProviderConnections: [AiProviderConnection!]!
    @field(resolver: "App\\GraphQL\\Queries\\MyAiProviderConnectionsQuery")
}

type Mutation {
  register(
    name: String!
    username: String!
    email: String!
    password: String!
    password_confirmation: String!
    device_name: String
  ): AuthPayload!
    @field(resolver: "App\\GraphQL\\Mutations\\RegisterMutation")

  login(
    login: String!
    password: String!
    device_name: String
  ): AuthPayload!
    @field(resolver: "App\\GraphQL\\Mutations\\LoginMutation")

  logout: Boolean! @field(resolver: "App\\GraphQL\\Mutations\\LogoutMutation")

  createCourse(input: CreateCourseInput!): Course!
    @field(resolver: "App\\GraphQL\\Mutations\\CreateCourseMutation")
  updateCourse(id: ID!, input: UpdateCourseInput!): Course!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateCourseMutation")
  deleteCourse(id: ID!): Boolean! @field(resolver: "App\\GraphQL\\Mutations\\DeleteCourseMutation")

  createChapter(input: CreateChapterInput!): Chapter!
    @field(resolver: "App\\GraphQL\\Mutations\\CreateChapterMutation")
  updateChapter(id: ID!, input: UpdateChapterInput!): Chapter!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateChapterMutation")
  deleteChapter(id: ID!): Boolean! @field(resolver: "App\\GraphQL\\Mutations\\DeleteChapterMutation")

  createLesson(input: CreateLessonInput!): Lesson!
    @field(resolver: "App\\GraphQL\\Mutations\\CreateLessonMutation")
  updateLesson(id: ID!, input: UpdateLessonInput!): Lesson!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateLessonMutation")
  deleteLesson(id: ID!): Boolean! @field(resolver: "App\\GraphQL\\Mutations\\DeleteLessonMutation")

  addLessonToCourse(input: AddLessonToCourseInput!): CourseLesson!
    @field(resolver: "App\\GraphQL\\Mutations\\AddLessonToCourseMutation")
  updateCourseLesson(id: ID!, input: UpdateCourseLessonInput!): CourseLesson!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateCourseLessonMutation")

  placeCourseLessonInChapter(input: PlaceCourseLessonInChapterInput!): ChapterLesson!
    @field(resolver: "App\\GraphQL\\Mutations\\PlaceCourseLessonInChapterMutation")
  removeCourseLessonFromChapter(chapter_id: ID!, course_lesson_id: ID!): Boolean!
    @field(resolver: "App\\GraphQL\\Mutations\\RemoveCourseLessonFromChapterMutation")

  uploadMedia(kind: String!, file: Upload!, altText: String, storageLocation: String): Media!
    @field(resolver: "App\\GraphQL\\Mutations\\UploadMediaMutation")
  uploadMediaFromUrl(kind: String!, url: String!, altText: String, storageLocation: String): Media!
    @field(resolver: "App\\GraphQL\\Mutations\\UploadMediaFromUrlMutation")
  bulkUploadMedia(kind: String!, files: [Upload!]!, altText: String, storageLocation: String): [Media!]!
    @field(resolver: "App\\GraphQL\\Mutations\\BulkUploadMediaMutation")
  deleteMedia(ids: [String!]!): DeleteResult!
    @field(resolver: "App\\GraphQL\\Mutations\\DeleteMediaMutation")
  updateStorageLocation(location: String!): StorageResult!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateStorageLocationMutation")

  createAiVideoProject(input: CreateAiVideoProjectInput!): AiVideoProject!
    @field(resolver: "App\\GraphQL\\Mutations\\CreateAiVideoProjectMutation")
  updateAiVideoProject(id: ID!, input: UpdateAiVideoProjectInput!): AiVideoProject!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateAiVideoProjectMutation")
  createAiVideoScene(projectId: ID!, input: CreateAiVideoSceneInput!): AiVideoScene!
    @field(resolver: "App\\GraphQL\\Mutations\\CreateAiVideoSceneMutation")
  updateAiVideoScene(id: ID!, input: UpdateAiVideoSceneInput!): AiVideoScene!
    @field(resolver: "App\\GraphQL\\Mutations\\UpdateAiVideoSceneMutation")
  importAiVideo(sceneId: ID!, video: Upload!): AiVideoGenerationJob!
    @field(resolver: "App\\GraphQL\\Mutations\\ImportAiVideoMutation")
  generateAiVideoScript(sceneId: ID!, brief: String!): AiVideoGenerationJob!
    @field(resolver: "App\\GraphQL\\Mutations\\GenerateAiVideoScriptMutation")
  configureAiProvider(
    providerKey: String!
    credentials: JSON!
    label: String
    settings: JSON
  ): AiProviderConnection!
    @field(resolver: "App\\GraphQL\\Mutations\\ConfigureAiProviderMutation")
  removeAiProviderConnection(id: ID!): Boolean!
    @field(resolver: "App\\GraphQL\\Mutations\\RemoveAiProviderConnectionMutation")
}

type AiProvider {
  id: ID!
  key: String!
  name: String!
  capabilities: JSON
  is_enabled: Boolean!
}

type AiProviderConnection {
  id: ID!
  label: String
  provider: AiProvider!
  settings: JSON
  is_active: Boolean!
  has_credentials: Boolean!
  created_at: DateTime!
  updated_at: DateTime!
}

type AiVideoProject {
  id: ID!
  user_id: ID!
  title: String!
  description: String
  status: String!
  scenes_count: Int
  scenes: [AiVideoScene!]! @hasMany(relation: "scenes")
  created_at: DateTime!
  updated_at: DateTime!
}

type AiVideoScene {
  id: ID!
  ai_video_project_id: ID!
  title: String!
  position: Int!
  script: String
  visual_prompt: String
  character_asset_id: ID
  location_asset_id: ID
  output_asset_id: ID
  duration_seconds: Int!
  aspect_ratio: String!
  status: String!
  generationJobs: [AiVideoGenerationJob!]! @hasMany(relation: "generationJobs")
  created_at: DateTime!
  updated_at: DateTime!
}

type AiVideoGenerationJob {
  id: ID!
  ai_video_scene_id: ID!
  provider: String!
  status: String!
  provider_job_id: String
  parameters: JSON
  error_message: String
  started_at: DateTime
  finished_at: DateTime
  created_at: DateTime!
  updated_at: DateTime!
}

type AiGeneratedAssetConnection {
  total: Int!
  items: [AiGeneratedAsset!]!
}

type AiGeneratedAsset {
  id: ID!
  type: String!
  name: String!
  url: String!
  mimeType: String
  size: Int
  altText: String
  createdAt: DateTime
  projectId: ID!
  projectTitle: String!
  sceneId: ID!
  sceneTitle: String!
}

type User {
    id: ID!
    name: String!
  username: String
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}

type AuthPayload {
  token: String!
  user: User!
}

type NavigationItem {
  name: String!
  path: String
  visits: Int!
  itemList: [NavigationLink!]
}

type NavigationLink {
  name: String!
  path: String!
  visits: Int!
  itemList: [NavigationLink!]
}

type Course {
  id: ID!
  title: String!
  description: String
  status: String!
  chapters: [Chapter!]! @hasMany(relation: "chapters")
  courseLessons: [CourseLesson!]! @hasMany(relation: "courseLessons")
  created_at: DateTime!
  updated_at: DateTime!
}

type Chapter {
  id: ID!
  course_id: ID!
  title: String!
  description: String
  position: Int!
  course: Course! @belongsTo(relation: "course")
  chapterLessons: [ChapterLesson!]! @hasMany(relation: "chapterLessons")
  courseLessons: [CourseLesson!]! @belongsToMany(relation: "courseLessons")
  created_at: DateTime!
  updated_at: DateTime!
}

type Lesson {
  id: ID!
  title: String!
  content: JSON!
  content_version: Int!
  created_at: DateTime!
  updated_at: DateTime!
}

type CourseLesson {
  id: ID!
  course_id: ID!
  lesson_id: ID!
  title: String!
  content: JSON!
  source_version: Int!
  course: Course! @belongsTo(relation: "course")
  lesson: Lesson! @belongsTo(relation: "lesson")
  chapters: [Chapter!]! @belongsToMany(relation: "chapters")
  created_at: DateTime!
  updated_at: DateTime!
}

type ChapterLesson {
  chapter_id: ID!
  course_lesson_id: ID!
  position: Int!
  chapter: Chapter! @belongsTo(relation: "chapter")
  courseLesson: CourseLesson! @belongsTo(relation: "courseLesson")
  created_at: DateTime!
  updated_at: DateTime!
}

type Media {
  id: String!
  kind: String!
  name: String!
  url: String!
  mimeType: String!
  size: Int!
  altText: String
  createdAt: String!
}

type MediaConnection {
  items: [Media!]!
  total: Int!
}

type DeleteResult {
  success: Boolean!
  deletedCount: Int!
}

type StorageResult {
  success: Boolean!
  location: String!
}

