  position: Int!
}

input UpdateChapterInput {
  title: String
  description: String
  position: Int
}

input CreateLessonInput {
  title: String!
  content: JSON
}

input UpdateLessonInput {
  title: String
  content: JSON
}

input AddLessonToCourseInput {
  course_id: ID!
  lesson_id: ID!
}

input UpdateCourseLessonInput {
  title: String
  content: JSON
}

input PlaceCourseLessonInChapterInput {
  chapter_id: ID!
  course_lesson_id: ID!
  position: Int!
}

input CreateAiVideoProjectInput {
  title: String!
  description: String
}

input UpdateAiVideoProjectInput {
  title: String
  description: String
  status: String
}

input CreateAiVideoSceneInput {
  title: String!
  position: Int
  script: String
  visual_prompt: String
